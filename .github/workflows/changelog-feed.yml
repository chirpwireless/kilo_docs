name: Build changelog feed

on:
  push:
    branches: [synchronize]
    paths:
      - 'faq/changelog.md'
      - 'scripts/build-changelog-feed.mjs'
      - '.github/workflows/changelog-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse changelog into releases.json
        run: node scripts/build-changelog-feed.mjs
        env:
          FEED_SOURCE_BRANCH: synchronize
          DOCS_BASE_URL: https://docs.kiloiot.io

      - name: Publish to changelog-feed branch
        run: |
          cd out
          git init -b changelog-feed
          git add releases.json
          git config user.name "changelog-feed-bot"
          git config user.email "noreply@chirpwireless.io"
          git commit -m "Update changelog feed"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" changelog-feed
